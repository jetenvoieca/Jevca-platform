[build]
  command = "npx prisma generate && npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The video still-picture maker uses the ffmpeg program from the
# ffmpeg-static package, kept as it is (not bundled) with its binary
# (2026-10-16 — see netlify/functions/make-video-posters-background.mts).
[functions."make-video-posters-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/ffmpeg"]
